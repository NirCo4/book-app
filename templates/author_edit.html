{% extends "base.html" %}
{% block title %}עריכת מחבר{% endblock %}
{% block content %}

<div class="row justify-content-center">
  <div class="col-lg-6">
    <div class="d-flex align-items-center mb-4">
      <a href="{{ url_for('authors') }}" class="btn btn-outline-secondary btn-sm me-3">
        <i class="bi bi-arrow-right"></i>
      </a>
      <h2 class="mb-0">עריכת מחבר: {{ author.name }}</h2>
    </div>

    <div class="card border-0 shadow-sm">
      <div class="card-body p-4">
        <form method="post">
          <div class="mb-3">
            <label class="form-label fw-semibold">שם <span class="text-danger">*</span></label>
            <input type="text" name="name" class="form-control"
                   value="{{ author.name }}" required>
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold">אימייל</label>
            <input type="email" name="email" class="form-control"
                   value="{{ author.email or '' }}">
          </div>
          <div class="mb-4">
            <label class="form-label fw-semibold">ביוגרפיה</label>
            <textarea name="bio" class="form-control" rows="5">{{ author.bio or '' }}</textarea>
          </div>
          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary">
              <i class="bi bi-save me-1"></i> שמור
            </button>
            <a href="{{ url_for('authors') }}" class="btn btn-outline-secondary">ביטול</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>

{% endblock %}
